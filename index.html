<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HECHONA TV</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
html,body{height:100%;margin:0;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.gold{background:linear-gradient(180deg,#fff3b0,#f5b81c 55%,#c98a0a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tab{padding:.5rem .9rem;border-radius:9999px;background:#262626;white-space:nowrap;font-weight:600;font-size:.85rem;border:0;color:#ddd}
.tab.on{background:linear-gradient(180deg,#ffe58a,#e0a114);color:#2a0204}
.tab:focus{outline:2px solid #fff}
.ch{display:flex;align-items:center;gap:.75rem;width:100%;padding:.55rem .6rem;border-radius:.5rem;text-align:left;background:transparent;border:0;color:#fff;font-size:1rem}
.ch:hover,.ch:focus{background:#3a0b0e;outline:2px solid #f5c84b}
.ch.on{background:#5c0508}
.st{font-size:1.5rem;padding:.4rem .7rem;color:#f5c84b;background:transparent;border:0}
.gh{position:sticky;top:0;background:#0d0d0d;color:#f5c84b;font-weight:700;padding:.5rem .6rem;font-size:.85rem;z-index:1}
.in{width:100%;padding:.65rem .8rem;border-radius:.5rem;background:#1c1c1c;border:1px solid #444;color:#fff;font-size:1rem}
.in:focus{outline:2px solid #f5c84b}
.btn{padding:.6rem 1rem;border-radius:.5rem;background:#b3121a;color:#fff;font-weight:700;border:0;font-size:.95rem}
.btn:focus{outline:2px solid #f5c84b}
#list{-webkit-overflow-scrolling:touch}
</style>
</head>
<body>

<!-- Logo: martillo dorado + hoz plateada (según la imagen enviada) -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".35" stop-color="#f5b81c"/><stop offset=".7" stop-color="#c98a0a"/><stop offset="1" stop-color="#ffd966"/></linearGradient>
<linearGradient id="silv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#aab2bd"/><stop offset=".7" stop-color="#eef1f5"/><stop offset="1" stop-color="#7f8894"/></linearGradient>
<symbol id="logo" viewBox="0 0 100 100">
<line x1="30" y1="30" x2="84" y2="84" stroke="#3a0508" stroke-width="11.5"/>
<line x1="30" y1="30" x2="84" y2="84" stroke="url(#gold)" stroke-width="10"/>
<rect x="10" y="20" width="34" height="14" rx="2" fill="url(#gold)" stroke="#3a0508" stroke-width=".8" transform="rotate(-45 27 27)"/>
<line x1="22" y1="72" x2="8" y2="87" stroke="#3a0508" stroke-width="9.5" stroke-linecap="round"/>
<line x1="22" y1="72" x2="8" y2="87" stroke="url(#silv)" stroke-width="8" stroke-linecap="round"/>
<path d="M38 8C80 10 100 48 66 74C52 84 34 80 20 72C50 74 70 60 72 44C73 28 60 14 38 8Z" fill="url(#silv)" stroke="#3a0508" stroke-width=".8"/>
<path d="M0-7L1.4-1.4L7 0L1.4 1.4L0 7L-1.4 1.4L-7 0L-1.4-1.4Z" fill="#fff" transform="translate(62 17)"/>
<path d="M0-7L1.4-1.4L7 0L1.4 1.4L0 7L-1.4 1.4L-7 0L-1.4-1.4Z" fill="#fff" transform="translate(22 21) scale(.8)"/>
<path d="M0-7L1.4-1.4L7 0L1.4 1.4L0 7L-1.4 1.4L-7 0L-1.4-1.4Z" fill="#fff" transform="translate(27 66) scale(.7)"/>
</symbol>
</defs>
</svg>

<div id="app" class="fixed inset-0">
  <video id="v" class="absolute inset-0 w-full h-full bg-black" autoplay playsinline></video>

  <div id="splash" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6" style="background:radial-gradient(circle at 50% 38%,#b3121a,#5c0508 62%,#2a0204)">
    <svg style="width:min(58vmin,320px);height:min(58vmin,320px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))"><use href="#logo" xlink:href="#logo" width="100%" height="100%"/></svg>
    <h1 class="gold text-4xl sm:text-5xl font-black tracking-wide mt-4">HECHONA TV</h1>
    <p class="text-neutral-200 mt-2">Toca la pantalla o pulsa OK para ver los canales</p>
  </div>

  <div id="toast" class="absolute left-4 bottom-6 px-4 py-2 rounded-lg text-lg font-semibold pointer-events-none" style="background:rgba(0,0,0,.75);opacity:0;transition:opacity .3s;z-index:5"></div>

  <div class="absolute top-3 right-3 flex gap-2" style="z-index:10">
    <button id="bm" class="btn" style="background:rgba(0,0,0,.65)" aria-label="Menú">☰ Canales</button>
    <button id="bf" class="btn" style="background:rgba(0,0,0,.65)" aria-label="Pantalla completa">⛶</button>
  </div>

  <aside id="drawer" class="absolute top-0 left-0 bottom-0 flex flex-col -translate-x-full transition-transform duration-200" style="width:92vw;max-width:440px;background:rgba(10,10,10,.96);z-index:20">
    <div class="flex items-center gap-3 p-3">
      <div class="w-11 h-11 rounded-lg flex-none" style="background:radial-gradient(#b3121a,#5c0508)"><svg class="w-full h-full"><use href="#logo" xlink:href="#logo" width="100%" height="100%"/></svg></div>
      <div class="gold text-2xl font-black">HECHONA TV</div>
    </div>
    <div class="px-3"><input id="q" class="in" type="search" placeholder="Buscar canal…" autocomplete="off"></div>
    <div id="tabs" class="flex gap-2 overflow-x-auto p-3"></div>

    <div id="p-pais" class="px-3 pb-2 hidden"><select id="sel" class="in"></select></div>
    <div id="p-mine" class="px-3 pb-2 hidden">
      <input id="url" class="in mb-2" type="url" placeholder="Pega la URL de tu lista M3U">
      <div class="flex gap-2 items-center flex-wrap">
        <button id="go" class="btn">Cargar URL</button>
        <label class="btn" style="background:#333;cursor:pointer" tabindex="0" id="fl">Subir archivo<input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" class="hidden"></label>
      </div>
    </div>

    <div id="stat" class="px-3 pb-1 text-sm text-neutral-400"></div>
    <div id="list" class="flex-1 overflow-y-auto px-2 pb-6"></div>
  </aside>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var LS={g:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var U={sereno:'https://gia.tv/streams/208643.m3u',tal:'https://gia.tv/streams/208260.m3u',retro:'https://canalcine35mm.wixsite.com/live',sup:'http://bit.ly/guilmoncito',cl1:'https://www.m3u.cl/lista/CL.m3u',cl2:'http://m3u.cl/lista/CL.m3u'};
var WEST=[
['Grjngo Plex(es)','https://amogonetworx-grjngo-2-eu.plex.wurl.tv/2000.m3u8'],
['Grjngo HD spain','https://86ebcafef90e449fbb9439c196e7d149.mediatailor.us-east-1.amazonaws.com/v1/master/0fb304b2320b25f067414d481a779b77db81760d/RakutenTV-es_GrjngoPeliculasDelOeste-1/playlist.m3u8'],
['Grjngo','https://amogonetworx-grjngo-2-eu.plex.wurl.tv/2000.m3u8'],
['Grjngo spain','https://amogo-networx-grjngopelculasdeloeste-1-es.rakuten.wurl.tv/playlist.m3u8'],
['Zylo cine Western','https://d2nq34q0i1r3la.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-awohw8g217ho8/CineWestern_ES.m3u8'],
['West','https://cablered.iptvperu.tv:1936/cablered/west/playlist.m3u8']];
var COUNTRIES=[['Chile','cl'],['Argentina','ar'],['México','mx'],['España','es'],['Perú','pe'],['Colombia','co'],['Venezuela','ve'],['Ecuador','ec'],['Bolivia','bo'],['Uruguay','uy'],['Paraguay','py'],['Brasil','br'],['Costa Rica','cr'],['Panamá','pa'],['Guatemala','gt'],['Honduras','hn'],['El Salvador','sv'],['Nicaragua','ni'],['Cuba','cu'],['Rep. Dominicana','do'],['Puerto Rico','pr'],['Estados Unidos','us'],['Canadá','ca'],['Reino Unido','uk'],['Francia','fr'],['Italia','it'],['Alemania','de'],['Portugal','pt']];
var TABS=[
{id:'fav',t:'★ FAVORITOS'},
{id:'mix',t:'MIX TV',grp:1,src:[['Sereno TV',U.sereno],['Tal tal iptv',U.tal],['Retro bigtv',U.retro]]},
{id:'sup',t:'SUPER TV',src:[['Super TV',U.sup]]},
{id:'cl',t:'CHILE TV',src:[['',U.cl1],['',U.cl2]]},
{id:'west',t:'WESTERN'},
{id:'pais',t:'TV PAÍSES'},
{id:'mine',t:'MI LISTA'}];

var favs=LS.g('hz_favs',[]),cur=LS.g('hz_tab','mix'),cc=LS.g('hz_cc','cl'),cache={},data=[],view=[],pl=[],ix=-1,now=null,hls=null,menu=false,tt=null,tok=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function key(c){return c.n+'|'+c.u}
function isF(c){return favs.some(function(f){return key(f)===key(c)})}
function tog(c){if(!c)return;if(isF(c))favs=favs.filter(function(f){return key(f)!==key(c)});else favs.push({n:c.n,u:c.u,g:c.g,l:c.l});LS.s('hz_favs',favs);toast(isF(c)?'★ Agregado a favoritos':'Quitado de favoritos')}

/* ---------- Red / M3U ---------- */
function ft(u){
  var tries=[u,'https://corsproxy.io/?'+encodeURIComponent(u),'https://api.allorigins.win/raw?url='+encodeURIComponent(u)],i=0;
  function next(){
    if(i>=tries.length)return Promise.reject(new Error('fail'));
    var t=tries[i++],ctl=window.AbortController?new AbortController():null,to=ctl?setTimeout(function(){ctl.abort()},15000):null;
    return fetch(t,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(to);if(!r.ok)throw 0;return r.text()}).then(function(x){if(!x||x.length<10)throw 0;return x}).catch(next);
  }
  return next();
}
function parse(t,g){
  var out=[],L=t.split(/\r?\n/),m=null,i,l;
  for(i=0;i<L.length;i++){
    l=L[i].trim();
    if(l.indexOf('#EXTINF')===0){m={n:l.split(',').slice(1).join(',').trim(),g:(/group-title="([^"]*)"/.exec(l)||[])[1]||'',l:(/tvg-logo="([^"]*)"/.exec(l)||[])[1]||''}}
    else if(l.indexOf('#EXTGRP:')===0&&m&&!m.g){m.g=l.slice(8).trim()}
    else if(l&&l.charAt(0)!=='#'&&/^https?:/i.test(l)){m=m||{n:'',g:'',l:''};out.push({n:m.n||'Canal '+(out.length+1),u:l,g:g||m.g||'Sin categoría',l:m.l});m=null}
  }
  if(!out.length){ /* páginas web con enlaces .m3u8 incrustados */
    var s={},r=t.match(/https?:\/\/[^\s"'<>\\]+?\.m3u8[^\s"'<>\\]*/g)||[];
    r.forEach(function(u){if(!s[u]){s[u]=1;out.push({n:(g||'Canal')+' '+(out.length+1),u:u,g:g||'Sin categoría',l:''})}});
  }
  return out;
}
function cKey(id){return id==='pais'?'pais_'+cc:id}
function load(id){
  var k=cKey(id);if(cache[k])return Promise.resolve(cache[k]);
  var T=TABS.filter(function(x){return x.id===id})[0],p;
  if(id==='fav')return Promise.resolve(favs);
  if(id==='west')return Promise.resolve(WEST.map(function(w){return{n:w[0],u:w[1],g:'Western',l:''}}));
  if(id==='mine')return Promise.resolve(LS.g('hz_mine',{ch:[]}).ch||[]);
  if(id==='pais')p=ft('https://iptv-org.github.io/iptv/countries/'+cc+'.m3u').then(function(t){return parse(t,'')}).catch(function(){return[]});
  else p=Promise.all(T.src.map(function(s){return ft(s[1]).then(function(t){return parse(t,T.grp?s[0]:'')}).catch(function(){return[]})})).then(function(a){
    var o=[],seen={};a.forEach(function(x){x.forEach(function(c){if(!seen[c.u]){seen[c.u]=1;o.push(c)}})});return o});
  return p.then(function(r){
    if(r.length){LS.s('hz_c_'+k,r)}else{r=LS.g('hz_c_'+k,[])}
    if(r.length)cache[k]=r;return r});
}

/* ---------- Interfaz ---------- */
function show(id){
  cur=id;LS.s('hz_tab',id);var my=++tok;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.dataset.t===id)});
  $('p-pais').classList.toggle('hidden',id!=='pais');
  $('p-mine').classList.toggle('hidden',id!=='mine');
  $('stat').textContent='Cargando…';$('list').innerHTML='';
  load(id).then(function(r){if(my!==tok)return;data=r;render()});
}
function row(c,i){
  var on=now&&key(now)===key(c);
  return '<div class="flex items-center"><button class="ch'+(on?' on':'')+'" data-i="'+i+'">'+
    (c.l?'<img src="'+esc(c.l)+'" loading="lazy" class="w-9 h-9 object-contain flex-none" onerror="this.style.visibility=\'hidden\'">':'<div class="w-9 h-9 flex-none"></div>')+
    '<span class="truncate">'+esc(c.n)+'</span></button><button class="st" tabindex="-1" data-s="'+i+'" aria-label="Favorito">'+(isF(c)?'★':'☆')+'</button></div>';
}
function render(){
  var q=$('q').value.toLowerCase(),base=cur==='fav'?favs:data,h='';
  var f=base.filter(function(c){return!q||c.n.toLowerCase().indexOf(q)>-1});
  view=[];
  if(cur==='fav'){f.forEach(function(c){h+=row(c,view.length);view.push(c)})}  /* favoritos: lista continua, sin categorías */
  else{
    var order=[],map={};f.forEach(function(c){if(!map[c.g]){map[c.g]=[];order.push(c.g)}map[c.g].push(c)});
    order.forEach(function(g){h+='<div class="gh">'+esc(g)+' ('+map[g].length+')</div>';map[g].forEach(function(c){h+=row(c,view.length);view.push(c)})});
  }
  $('list').innerHTML=h;
  $('stat').textContent=view.length?view.length+' canales':(cur==='fav'?'Aún no tienes favoritos. Toca ☆ en cualquier canal.':cur==='mine'?'Carga una URL o sube un archivo M3U.':'No se pudieron cargar canales de esta lista.');
}
function toast(m){var t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){t.style.opacity=0},2500)}
function mark(){Array.prototype.forEach.call(document.querySelectorAll('.ch'),function(b){var c=view[b.dataset.i];b.classList.toggle('on',!!(c&&now&&key(c)===key(now)))})}

/* ---------- Reproducción ---------- */
function play(list,i){
  pl=list;ix=i;now=list[i];var v=$('v'),u=now.u,fell=false;
  $('splash').style.display='none';toast(now.n);mark();
  if(hls){hls.destroy();hls=null}
  function nat(){v.src=u;var p=v.play();if(p&&p.catch)p.catch(function(){toast('No se pudo reproducir este canal')})}
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:20});hls.loadSource(u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){var p=v.play();if(p&&p.catch)p.catch(function(){})});
    hls.on(Hls.Events.ERROR,function(e,d){
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!fell){fell=true;hls.recoverMediaError();return}
      hls.destroy();hls=null;nat();
    });
  }else nat();
}
function step(d){
  if(!pl.length){if(!view.length)return;pl=view;ix=-1}
  ix=(ix+d+pl.length)%pl.length;play(pl,ix);
}
function openM(b){
  menu=(b===undefined)?!menu:b;
  $('drawer').classList.toggle('-translate-x-full',!menu);
  if(menu)setTimeout(function(){var e=document.querySelector('.ch.on')||document.querySelector('.ch');if(e){e.focus();e.scrollIntoView({block:'center'})}},220);
  else if(document.activeElement)document.activeElement.blur();
}

/* ---------- Eventos ---------- */
$('v').onclick=$('splash').onclick=function(){openM()};
$('bm').onclick=function(e){e.stopPropagation();openM()};
$('bf').onclick=function(e){e.stopPropagation();var d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el);else $('v').webkitEnterFullscreen&&$('v').webkitEnterFullscreen()}};
$('q').oninput=render;
$('list').onclick=function(e){
  var b=e.target.closest('[data-s]');
  if(b){var c=view[b.dataset.s];tog(c);if(cur==='fav')render();else b.textContent=isF(c)?'★':'☆';return}
  b=e.target.closest('[data-i]');
  if(b){play(view,+b.dataset.i);openM(false)}
};
$('tabs').innerHTML=TABS.map(function(t){return'<button class="tab" data-t="'+t.id+'">'+t.t+'</button>'}).join('');
$('tabs').onclick=function(e){var b=e.target.closest('.tab');if(b){$('q').value='';show(b.dataset.t)}};
$('sel').innerHTML=COUNTRIES.map(function(c){return'<option value="'+c[1]+'"'+(c[1]===cc?' selected':'')+'>'+c[0]+'</option>'}).join('');
$('sel').onchange=function(){cc=this.value;LS.s('hz_cc',cc);show('pais')};
var saved=LS.g('hz_mine',{url:'',ch:[]});$('url').value=saved.url||'';
function setMine(url,r){if(!r.length){$('stat').textContent='La lista no contiene canales válidos.';return}LS.s('hz_mine',{url:url,ch:r});cache.mine=r;show('mine')}
$('go').onclick=function(){var u=$('url').value.trim();if(!u)return;$('stat').textContent='Descargando lista…';ft(u).then(function(t){setMine(u,parse(t,''))}).catch(function(){$('stat').textContent='No se pudo descargar la lista (revisa el enlace).'})};
$('url').onkeydown=function(e){if(e.keyCode===13)$('go').click()};
$('file').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){setMine('',parse(String(r.result),''))};r.readAsText(f)};
$('fl').onkeydown=function(e){if(e.keyCode===13){e.preventDefault();$('file').click()}};

/* ---------- Control remoto (TV Hisense/VIDAA y teclado) ---------- */
document.addEventListener('keydown',function(e){
  var k=e.keyCode,t=e.target.tagName,inp=(t==='INPUT'||t==='SELECT'||t==='TEXTAREA');
  var UP=k===38||k===427||k===33,DN=k===40||k===428||k===34;
  if(k===405||(!inp&&(k===70||e.key==='*'))){ /* Amarillo / F / * = favorito */
    var f=menu&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.i?view[document.activeElement.dataset.i]:now;
    if(f){tog(f);if(menu){var a=document.activeElement,i=a&&a.dataset?a.dataset.i:null;if(cur==='fav'){render()}else{var s=document.querySelector('[data-s="'+i+'"]');if(s)s.textContent=isF(f)?'★':'☆'}}}
    e.preventDefault();return}
  if(!menu){
    if(UP){step(1);e.preventDefault()}
    else if(DN){step(-1);e.preventDefault()}
    else if(k===13||k===32||k===37||k===39){openM(true);e.preventDefault()}
    return}
  if(k===461||k===10009||k===27||(k===8&&!inp)){openM(false);e.preventDefault();return}
  if(!inp&&(k===37||k===39)){
    var ids=TABS.map(function(x){return x.id}),n=(ids.indexOf(cur)+(k===39?1:-1)+ids.length)%ids.length;
    show(ids[n]);e.preventDefault();return}
  if(k===38||k===40){
    var els=[$('q')];
    if(cur==='pais')els.push($('sel'));
    if(cur==='mine')els.push($('url'),$('go'),$('fl'));
    els=els.concat(Array.prototype.slice.call(document.querySelectorAll('.ch')));
    var p=els.indexOf(document.activeElement),n2=p<0?els.length>1?(cur==='fav'||view.length?els.length-view.length:0):0:p+(k===40?1:-1);
    if(n2<0)n2=0;if(n2>=els.length)n2=els.length-1;
    els[n2].focus();if(els[n2].scrollIntoView)els[n2].scrollIntoView({block:'nearest'});
    e.preventDefault()}
  else if(UP||DN){step(UP?1:-1);e.preventDefault()}
});

show(cur);
</script>
</body>
</html>
