/* ---------- Reproducción: hls.js / mpegts.js (Astra, .ts) / nativo ---------- */
var hls=null,ts=null,pt=0,stt=0,wt=0,vv=$('v');
function spin(on){$('spin').style.display=(on&&$('splash').style.display==='none')?'block':'none'}
function lib(n,cb){var c=0;(function w(){if(window[n])return cb(true);if(++c>40)return cb(false);setTimeout(w,150)})()}
['waiting','stalled'].forEach(function(ev){vv.addEventListener(ev,function(){spin(1);clearTimeout(wt);wt=setTimeout(reconnect,15000)})});
['playing','canplay'].forEach(function(ev){vv.addEventListener(ev,function(){spin(0);clearTimeout(stt);clearTimeout(wt)})});
vv.addEventListener('playing',function(){splash(false)});
function sp(){var p=vv.play();if(p&&p.catch)p.catch(function(){vv.muted=true;var q=vv.play();if(q&&q.catch)q.catch(function(){});toast('Sonido silenciado: toca la pantalla para activarlo')})}
function kill(){
  clearTimeout(stt);clearTimeout(wt);vv.onerror=null;
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  if(ts){try{ts.pause();ts.unload();ts.detachMediaElement();ts.destroy()}catch(e){}ts=null}
  vv.removeAttribute('src');try{vv.load()}catch(e){}
}
function engines(u){
  if(/^(udp|rtp|rtmp|rtsp|srt):/i.test(u))return null;
  if(/\.(mp4|webm|mkv|mov|mp3|aac|ogg)(\?|#|$)/i.test(u))return['nat'];
  if(/m3u8|\/hls\/|\.isml?\//i.test(u))return['hls','nat'];
  return['ts','hls','nat'];
}
function run(a,i,my){
  if(my!==pt)return;
  if(i>=a.length){kill();spin(0);splash(true);toast('No se pudo reproducir este canal. Elige otro.');openM(true);return}
  var x=a[i],ne=0,me=0;
  kill();spin(1);
  var fail=function(){if(my===pt)run(a,i+1,my)};
  stt=setTimeout(fail,14000);
  if(x.e==='hls'){
    lib('Hls',function(ok){
      if(my!==pt)return;
      if(!ok||!Hls.isSupported())return fail();
      hls=new Hls({enableWorker:true,lowLatencyMode:false,startFragPrefetch:true,capLevelToPlayerSize:true,
        abrEwmaDefaultEstimate:2000000,abrBandWidthFactor:.85,abrBandWidthUpFactor:.6,
        maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:20,maxBufferHole:.5,
        liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,nudgeMaxRetry:6,
        manifestLoadingTimeOut:8000,manifestLoadingMaxRetry:2,levelLoadingTimeOut:8000,levelLoadingMaxRetry:2,
        fragLoadingTimeOut:12000,fragLoadingMaxRetry:3});
      hls.loadSource(x.u);hls.attachMedia(vv);
      hls.on(Hls.Events.MANIFEST_PARSED,function(){sp()});
      hls.on(Hls.Events.ERROR,function(e,d){
        if(!d.fatal)return;
        if(d.response&&d.response.code>=400)return fail();
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&ne++<2){setTimeout(function(){if(hls)hls.startLoad()},800);return}
        if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&me++<2){if(me===2)hls.swapAudioCodec();hls.recoverMediaError();return}
        fail();
      });
    });
  }else if(x.e==='ts'){
    lib('mpegts',function(ok){
      if(my!==pt)return;
      if(!ok||!mpegts.isSupported())return fail();
      ts=mpegts.createPlayer({type:'mpegts',isLive:true,url:x.u},{enableWorker:true,enableStashBuffer:true,autoCleanupSourceBuffer:true,liveBufferLatencyChasing:true,liveBufferLatencyMaxLatency:6,liveBufferLatencyMinRemain:2});
      ts.attachMediaElement(vv);ts.on(mpegts.Events.ERROR,fail);ts.load();sp();
    });
  }else{
    vv.onerror=fail;vv.src=x.u;sp();
  }
}
function play(list,i,auto){
  clearTimeout(zt);pix=-1;if(!auto)rec=0;
  pl=list;ix=i;now=list[i];LS.s('hz_last',now);
  toast((i+1)+'/'+list.length+' · '+now.n);mark();
  var u=now.u,e=engines(u),my=++pt;
  if(!e){kill();spin(0);splash(true);toast('Protocolo '+u.split(':')[0]+' no es compatible con navegadores. En Astra usa la salida HTTP.');return}
  var urls=[u];
  if(location.protocol==='https:'&&/^http:/i.test(u))urls=[u.replace(/^http:/i,'https:'),u];
  var a=[];urls.forEach(function(x){e.forEach(function(en){a.push({u:x,e:en})})});
  run(a,0,my);
}
function reconnect(){
  if(!now||!pl.length)return;
  if(rec>=3){spin(0);toast('Señal inestable. Prueba otro canal.');return}
  rec++;toast('Reconectando…');play(pl,ix,true);
}
window.addEventListener('online',function(){if(now)reconnect()});
/* Un canal por pulsación: el nombre cambia al instante y se carga el canal donde te detienes */
function step(d){
  if(!pl.length){if(!view.length)return;pl=view;ix=-1}
  if(pix<0)pix=ix<0?(d>0?-1:0):ix;
  pix=(pix+d+pl.length)%pl.length;
  toast((pix+1)+'/'+pl.length+' · '+pl[pix].n);
  clearTimeout(zt);zt=setTimeout(function(){var i=pix;pix=-1;play(pl,i)},250);
}
function tabStep(d){
  var ids=TABS.map(function(x){return x.id}),n=(ids.indexOf(cur)+d+ids.length)%ids.length;
  $('q').value='';show(ids[n]);
}
var nb='',nt=0;
function digit(d){
  nb+=d;if(nb.length>4)nb=String(d);toast('Canal '+nb);
  clearTimeout(nt);nt=setTimeout(function(){var n=+nb;nb='';if(pl.length&&n>=1&&n<=pl.length)play(pl,n-1);else toast('Canal inexistente')},1500);
}
function openM(b){
  menu=(b===undefined)?!menu:b;
  $('drawer').classList.toggle('open',menu);
  if(menu)setTimeout(function(){var e=document.querySelector('.ch.on')||document.querySelector('.ch');if(e){e.focus({preventScroll:true});e.scrollIntoView({block:'center'})}},220);
  else if(document.activeElement)document.activeElement.blur();
}

/* ---------- Carga de listas (URL, archivos, texto) ---------- */
function addList(name,url,ch){
  if(!ch.length){stat('La lista no contiene canales válidos o no se pudo descargar.');return}
  var a=ov(cur).filter(function(l){return l.name!==name});
  a.push({name:name,url:url,ch:ch});OV[cur]=a;LS.s('hz_o_'+cur,a);show(cur);
}
function urlName(u){try{var x=new URL(u);return x.hostname+x.pathname.replace(/\/$/,'')}catch(e){return u.slice(0,30)}}
$('go').onclick=function(){var u=$('url').value.trim();if(!u)return;stat('Descargando lista…');getList(u,'').then(function(r){addList(urlName(u),u,r)})};
$('url').onkeydown=function(e){if(e.keyCode===13)$('go').click()};
$('file').onchange=function(){
  var fs=Array.prototype.slice.call(this.files);this.value='';
  fs.forEach(function(f){var r=new FileReader();r.onload=function(){addList(f.name,'',parse(String(r.result),''))};r.readAsText(f)});
};
$('fl').onkeydown=function(e){if(e.keyCode===13){e.preventDefault();$('file').click()}};
$('gt').onclick=function(){var t=$('txt').value;if(!t.trim())return;addList('Texto pegado',' ',parse(t,''));$('txt').value=''};
$('rl').onclick=function(){var k=cKey(cur);delete cache[k];LS.r('hz_c_'+k);show(cur)};
$('chips').onclick=function(e){var b=e.target.closest('[data-d]');if(!b)return;var a=ov(cur);a.splice(+b.dataset.d,1);LS.s('hz_o_'+cur,a);show(cur)};

/* ---------- Puntero / táctil ---------- */
$('v').onclick=$('splash').onclick=function(){vv.muted=false;openM()};
$('pv').onclick=function(){vv.muted=false;step(-1)};
$('nx').onclick=function(){vv.muted=false;step(1)};
$('bf').onclick=function(e){e.stopPropagation();var d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el);else if(vv.webkitEnterFullscreen)vv.webkitEnterFullscreen()}};
var wl=0;
function wheelZap(e){if(menu)return;var n=Date.now();if(n-wl<350)return;wl=n;step(e.deltaY>0?1:-1)}
$('v').addEventListener('wheel',wheelZap);$('splash').addEventListener('wheel',wheelZap);
$('tabs').addEventListener('wheel',function(e){this.scrollLeft+=e.deltaY||e.deltaX;e.preventDefault()},{passive:false});
$('q').oninput=function(){clearTimeout(qt);qt=setTimeout(function(){render(false)},180)};
$('list').onclick=function(e){
  var b=e.target.closest('[data-s]');
  if(b){var c=view[b.dataset.s];tog(c);if(cur==='fav')render(false);else b.textContent=isF(c)?'★':'☆';return}
  b=e.target.closest('[data-i]');
  if(b){vv.muted=false;play(view,+b.dataset.i);openM(false)}
};
$('tabs').innerHTML=TABS.map(function(t){return'<button class="tab" data-t="'+t.id+'">'+t.t+'</button>'}).join('');
$('tabs').onclick=function(e){var b=e.target.closest('.tab');if(b){$('q').value='';show(b.dataset.t)}};
$('sel').innerHTML=COUNTRIES.map(function(c){return'<option value="'+c[1]+'"'+(c[1]===cc?' selected':'')+'>'+c[0]+'</option>'}).join('');
$('sel').onchange=function(){cc=this.value;LS.s('hz_cc',cc);show('pais')};

(function(){var o=LS.g('hz_mine',null);if(o&&o.ch&&o.ch.length&&!LS.g('hz_o_mine',null))LS.s('hz_o_mine',[{name:o.url||'Mi lista',url:o.url||'',ch:o.ch}])})();

/* ---------- Control remoto (Hisense/VIDAA y teclado) ---------- */
function cls(e){
  var k=e.keyCode,n=e.key;
  if(k===417||k===228||k===176||n==='MediaFastForward'||n==='MediaTrackNext')return'ff';
  if(k===412||k===227||k===177||n==='MediaRewind'||n==='MediaTrackPrevious')return'rw';
  if(k===427||k===33||n==='ChannelUp'||n==='PageUp')return'cu';
  if(k===428||k===34||n==='ChannelDown'||n==='PageDown')return'cd';
  return'';
}
function items(){return Array.prototype.slice.call(document.querySelectorAll('.ch'))}
function jump(n){
  var it=items();if(!it.length)return;
  var p=it.indexOf(document.activeElement);if(p<0)p=Math.max(0,it.indexOf(document.querySelector('.ch.on')));
  var t=Math.min(it.length-1,Math.max(0,p+n));
  it[t].focus({preventScroll:true});it[t].scrollIntoView({block:'center'});
}
document.addEventListener('keydown',function(e){
  var k=e.keyCode,t=e.target.tagName,inp=(t==='INPUT'||t==='SELECT'||t==='TEXTAREA'),c=cls(e);
  if(k===406||(!inp&&k===68)){dbg=!dbg;toast(dbg?'Diagnóstico de teclas: ACTIVADO':'Diagnóstico de teclas: apagado');e.preventDefault();return}
  if(dbg)toast('Tecla '+k+' · '+e.key);
  vv.muted=false;
  if(k===405||(!inp&&(k===70||e.key==='*'))){
    var a=document.activeElement,i=a&&a.dataset?a.dataset.i:null;
    var f=menu&&i!==null&&i!==undefined?view[i]:now;
    if(f){tog(f);if(menu){if(cur==='fav'){render(false)}else{var s=document.querySelector('[data-s="'+i+'"]');if(s)s.textContent=isF(f)?'★':'☆'}}}
    e.preventDefault();return}
  if(k===415||k===19||k===179||e.key==='MediaPlayPause'||e.key==='MediaPlay'||e.key==='MediaPause'){
    if(vv.paused)sp();else vv.pause();e.preventDefault();return}
  if(!menu){
    /* Menú cerrado: ⏩ CH+ ↑ → = siguiente · ⏪ CH− ↓ ← = anterior (uno por pulsación) */
    if(c==='ff'||c==='cu'||k===38||k===39){if(!e.repeat)step(1)}
    else if(c==='rw'||c==='cd'||k===40||k===37){if(!e.repeat)step(-1)}
    else if(k===13||k===32)openM(true);
    else if(!inp&&((k>=48&&k<=57)||(k>=96&&k<=105)))digit(k>=96?k-96:k-48);
    else return;
    e.preventDefault();return}
  /* Menú abierto */
  if(k===461||k===10009||k===27||(k===8&&!inp)){openM(false);e.preventDefault();return}
  if(c==='ff'||c==='rw'){if(!e.repeat)tabStep(c==='ff'?1:-1);e.preventDefault();return}
  if(c==='cu'||c==='cd'){jump(c==='cu'?8:-8);e.preventDefault();return}
  if(!inp&&(k===37||k===39)){tabStep(k===39?1:-1);e.preventDefault();return}
  if(k===38||k===40){
    var els=[$('q')];
    if(cur==='pais')els.push($('sel'));
    if(ADD.indexOf(cur)>-1)els.push($('url'),$('go'),$('fl'),$('rl'),$('txt'),$('gt'));
    var head=els.length;
    els=els.concat(items());
    var p=els.indexOf(document.activeElement),n2=p<0?head:p+(k===40?1:-1);
    if(n2<0)n2=0;if(n2>=els.length)n2=els.length-1;
    els[n2].focus({preventScroll:true});els[n2].scrollIntoView({block:'nearest'});
    e.preventDefault()}
});

show(cur);
</script>
